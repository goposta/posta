version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    goconst:
      # A JSON field name or a database column used as a map key is data, not a
      # magic constant: hoisting `okapi.M{"message": ...}` behind an identifier
      # makes the response shape harder to read, not easier. Without this, the
      # single string "message" is reported 43 times across the handlers.
      ignore-map-keys: true
    gocyclo:
      min-complexity: 75
    revive:
      rules:
        - name: comment-spacings
  exclusions:
    generated: lax
    rules:
      - linters:
          - dupl
          - lll
        path: pkg/*
      - linters:
          - dupl
          - lll
        path: internal/*
      - linters:
          - goconst
        path: _test\.go
      - linters:
          - misspell
        path: internal/services/seeder/constants\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$