# Posta on Miabi (server + dedicated worker, one node)
# ===================================================
# A complete Posta deployment as one miabi.io/v1 Project: a managed PostgreSQL
# database, a dedicated Redis, generated secrets, a volume for attachments, and
# a `posta` stack holding two applications, plus a public HTTPS route with
# automatic TLS.
#
#   posta          HTTP API + web UI
#   posta-worker   queue consumer (sending, retries, campaigns)
#
# Both mount the same posta-data volume, so they run on the volume's node.
# This suits small and medium installations; for replicas across a cluster,
# with attachments on S3, see posta-replicated.yaml.
#
# Settings both applications need live once, in the stack's env; each
# application adds only its own. An application's key overrides the stack's.
# Stack env needs Miabi 1.10.25 or later.
#
# Before applying, replace posta.example.com (three places) with your hostname.
#
# Apply:
#   miabi apply -f posta.yaml --dry-run   # preview the plan
#   miabi apply -f posta.yaml             # converge the workspace
#
# After the first apply, reveal the generated admin password in the workspace
# vault (secret `posta-admin-password`) and sign in as admin@example.com.
apiVersion: miabi.io/v1
kind: Project
metadata:
  name: posta
spec:
  description: Posta transactional email platform, with Postgres, Redis, server, worker and route.
  resources:
    # Secrets are generated once at create time and never change on re-apply.
    # POSTA_JWT_SECRET signs sessions: anyone who knows it can forge one.
    - apiVersion: miabi.io/v1
      kind: Secret
      metadata: { name: posta-jwt-secret }
      spec:
        generate: true
        length: 64

    # Encrypts SMTP server passwords at rest (hashed to an AES-256 key, so any
    # length works). Do not rotate it: stored passwords would no longer decrypt.
    - apiVersion: miabi.io/v1
      kind: Secret
      metadata: { name: posta-encryption-key }
      spec:
        generate: true
        length: 48

    # Used only to create the first admin account on an empty database.
    - apiVersion: miabi.io/v1
      kind: Secret
      metadata: { name: posta-admin-password }
      spec:
        generate: true
        length: 24

    - apiVersion: miabi.io/v1
      kind: Database
      metadata: { name: posta-db }
      spec:
        engine: postgres
        version: "17-alpine"
        instance: auto           # auto | dedicated | shared

    # Queue (asynq), sessions, caches and realtime events. Redis is always a
    # dedicated instance; Miabi sets its password.
    - apiVersion: miabi.io/v1
      kind: Database
      metadata: { name: posta-redis }
      spec:
        engine: redis
        version: "8-alpine"
        instance: dedicated

    # Attachments and inbound mail bodies, written by the server and read by
    # the worker. A volume lives on one node; replicas need S3 instead (see
    # posta-replicated.yaml).
    - apiVersion: miabi.io/v1
      kind: Volume
      metadata: { name: posta-data }
      spec:
        size: 5Gi

    - apiVersion: miabi.io/v1
      kind: Stack
      metadata: { name: posta }
      spec:
        description: Posta server and worker.
        env:
          POSTA_ENV: production
          # Must match the route host; also the base for tracking and unsubscribe links.
          POSTA_WEB_URL: "https://posta.example.com"

          # The database's own settings, so nothing has to be appended to a URL.
          # No TLS on the workspace's private network.
          POSTA_DB_HOST: "{{ .databases.posta-db.host }}"
          POSTA_DB_PORT: "{{ .databases.posta-db.port }}"
          POSTA_DB_NAME: "{{ .databases.posta-db.name }}"
          POSTA_DB_USER: "{{ .databases.posta-db.user }}"
          POSTA_DB_PASSWORD: "{{ .databases.posta-db.password }}"
          POSTA_DB_SSL_MODE: disable

          # redis://:password@host:port
          POSTA_REDIS_URL: "{{ .databases.posta-redis.uri }}"

          # Secret references stay vault pointers, resolved at deploy, and database
          # credentials are stored as secrets by Miabi, so nothing needs secretEnv.
          POSTA_JWT_SECRET: "{{ .secrets.posta-jwt-secret }}"
          POSTA_ENCRYPTION_KEY: "{{ .secrets.posta-encryption-key }}"

          POSTA_BLOB_PROVIDER: filesystem
          POSTA_BLOB_FS_PATH: /data/attachments

          # Attachments on S3 instead of the volume: replace the two lines above
          # with these, after adding posta-s3-secret-key to the vault.
          # POSTA_BLOB_PROVIDER: s3
          # POSTA_BLOB_S3_ENDPOINT: s3.eu-central-1.amazonaws.com
          # POSTA_BLOB_S3_REGION: eu-central-1
          # POSTA_BLOB_S3_BUCKET: posta-attachments
          # POSTA_BLOB_S3_ACCESS_KEY: AKIAXXXXXXXXXXXXXXXX
          # POSTA_BLOB_S3_SECRET_KEY: "{{ .secrets.posta-s3-secret-key }}"
          # POSTA_BLOB_S3_USE_SSL: "true"
          # POSTA_BLOB_S3_PATH_STYLE: "false"     # true for MinIO and most self-hosted S3

          # Live chat: the widget script, the visitor API and the chat inbox.
          # POSTA_CHAT_ENABLED: "true"
          # POSTA_CHAT_MAX_STREAMS: "5000"          # per server process; over it, widgets poll
          # POSTA_CHAT_MAX_MESSAGE_BYTES: "4096"
          # POSTA_CHAT_IP_RATE_LIMIT: "60"          # conversation starts per IP per hour
          # POSTA_CHAT_RETENTION_DAYS: "365"        # closed and spam conversations
          # POSTA_CHAT_UNANSWERED_MINUTES: "5"      # email the team about a waiting visitor
        secretEnv:
         - POSTA_DB_USER

    # == API server ==========================================================
    - apiVersion: miabi.io/v1
      kind: Application
      metadata: { name: posta }
      spec:
        image: jkaninda/posta
        tag: "latest"            # pin a release tag in production
        stack: posta
        ports:
          - container: 9000
            scheme: http
        # The image's `posta` user. Stating it makes Miabi chown the volume
        # to it, so the server can write attachments.
        security:
          runAsUser: "100:101"
        healthcheck:
          type: http
          path: /healthz
          port: 9000
          startPeriodSeconds: 20
        # Shared settings come from the stack; these are the server's own.
        env:
          POSTA_ADMIN_EMAIL: admin@example.com
          POSTA_ADMIN_PASSWORD: "{{ .secrets.posta-admin-password }}"

          # Requests arrive through the Miabi gateway; trust its forwarded
          # client IP so rate limits and audit logs see the real address.
          # 10.63.0.0/16 is the default subnet of miabi-proxy, the network the
          # gateway shares with routed apps. Use your MIABI_SUBNET if the
          # install set one (see /etc/miabi/miabi.yaml, networking.proxy).
          POSTA_TRUSTED_PROXIES: "10.63.0.0/16"

          # Delivery belongs to posta-worker.
          POSTA_EMBEDDED_WORKER: "false"

          # System SMTP for invitations, password resets and daily reports.
          # Uncomment and set, after adding posta-system-smtp-password to the vault.
          # POSTA_SYSTEM_SMTP_HOST: smtp.example.com
          # POSTA_SYSTEM_SMTP_PORT: "587"
          # POSTA_SYSTEM_SMTP_USERNAME: notifications@example.com
          # POSTA_SYSTEM_SMTP_PASSWORD: "{{ .secrets.posta-system-smtp-password }}"
          # POSTA_SYSTEM_SMTP_FROM: notifications@example.com
          # POSTA_SYSTEM_SMTP_ENCRYPTION: starttls
        mounts:
          - volume: posta-data
            path: /data
        resources:
          memory: 512Mi
          cpu: "1"

        # == Optional: receive inbound email ==================================
        # Add to env:
        #   POSTA_INBOUND_ENABLED: "true"
        #   POSTA_INBOUND_HOSTNAME: posta.example.com   # must match your MX record
        # and publish the receiver on the node's port 25:
        #   - container: 2525
        #     protocol: tcp
        #     publish: true
        #     hostPort: 25

    # == Queue worker ========================================================
    - apiVersion: miabi.io/v1
      kind: Application
      metadata: { name: posta-worker }
      spec:
        image: jkaninda/posta
        tag: "latest"            # keep in lockstep with the server's tag
        command: ["worker"]
        stack: posta
        security:
          runAsUser: "100:101"
        # The worker serves /healthz, /readyz and /metrics on this port.
        healthcheck:
          type: http
          path: /healthz
          port: 9000
          startPeriodSeconds: 20
        ports:
          - container: 9000
            scheme: http
        # Shared settings come from the stack; these are the worker's own.
        env:
          POSTA_WORKER_CONCURRENCY: "10"
          POSTA_WORKER_MAX_RETRIES: "5"
          POSTA_WORKER_HEALTH_ENABLED: "true"
          POSTA_WORKER_HEALTH_PORT: "9000"
        mounts:
          - volume: posta-data
            path: /data
        resources:
          memory: 512Mi
          cpu: "1"

    # == Public route ========================================================
    - apiVersion: miabi.io/v1
      kind: Domain
      metadata: { name: posta.example.com }
      spec:
        tls: acme

    - apiVersion: miabi.io/v1
      kind: Route
      metadata: { name: posta-web }
      spec:
        hosts: [posta.example.com]
        app: posta
        port: 9000
        tls: acme
